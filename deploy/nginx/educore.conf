# EduCore — Nginx reverse proxy
# Frontend (SPA): http://127.0.0.1:8080
# Backend  (API):  http://127.0.0.1:8787
#
# Install:
#   sudo cp deploy/nginx/educore.conf /etc/nginx/sites-available/educore
#   sudo ln -sf /etc/nginx/sites-available/educore /etc/nginx/sites-enabled/educore
#   sudo nginx -t && sudo systemctl reload nginx

upstream educore_frontend {
    server 127.0.0.1:8080;
    keepalive 8;
}

upstream educore_api {
    server 127.0.0.1:8787;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name educore-school-erp-1ha7.arcada.app YOUR_DOMAIN;

    client_max_body_size 10m;

    # API — must be defined BEFORE the SPA catch-all
    location /api/ {
        proxy_pass http://educore_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://educore_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA + static assets
    location / {
        proxy_pass http://educore_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

